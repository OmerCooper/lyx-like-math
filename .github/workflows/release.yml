# Push a tag named like the version in manifest.json (e.g. 0.1.0) to build and publish a release
# with the three files Obsidian installs: main.js, manifest.json, styles.css.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Attest that the release files were built here
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
